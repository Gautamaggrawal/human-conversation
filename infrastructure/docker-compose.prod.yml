# Full stack for a single public VPS (API + web + Postgres + coturn).
# Usage:
#   cp infrastructure/.env.prod.example infrastructure/.env.prod
#   # edit PUBLIC_HOST, EXTERNAL_IP, Supabase keys, secrets
#   docker compose -f infrastructure/docker-compose.prod.yml --env-file infrastructure/.env.prod up -d --build
#
# Open firewall: 80/tcp, 3478/tcp+udp, 49152-49200/udp

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hc}
      POSTGRES_DB: ${POSTGRES_DB:-human_conversation}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ../backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hc} -d ${POSTGRES_DB:-human_conversation}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [hc]

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8081"
      DATABASE_URL: postgres://${POSTGRES_USER:-hc}:${POSTGRES_PASSWORD:-hc}@postgres:5432/${POSTGRES_DB:-human_conversation}?sslmode=disable
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      DEV_AUTH: ${DEV_AUTH:-false}
      AUTO_APPROVE_LISTENERS: ${AUTO_APPROVE_LISTENERS:-false}
      STUN_URLS: ${STUN_URLS:-stun:stun.l.google.com:19302}
      TURN_URLS: turn:${PUBLIC_HOST}:3478
      TURN_USERNAME: ${TURN_USERNAME:-hc}
      TURN_PASSWORD: ${TURN_PASSWORD:-hcpassword}
      TURN_PUBLIC_HOST: ${PUBLIC_HOST}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      MEDIA_GRACE_MS: ${MEDIA_GRACE_MS:-2500}
      ACCEPT_TIMEOUT_SEC: ${ACCEPT_TIMEOUT_SEC:-60}
      LEASE_TTL_SEC: ${LEASE_TTL_SEC:-30}
      HEARTBEAT_SWEEP_SEC: ${HEARTBEAT_SWEEP_SEC:-5}
    expose:
      - "8081"
    networks: [hc]

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${HTTP_PORT:-80}:80"
    networks: [hc]

  coturn:
    image: coturn/coturn:4.6.2
    restart: unless-stopped
    # Host networking so UDP relay works reliably on a VPS.
    network_mode: host
    environment:
      EXTERNAL_IP: ${EXTERNAL_IP}
      TURN_USERNAME: ${TURN_USERNAME:-hc}
      TURN_PASSWORD: ${TURN_PASSWORD:-hcpassword}
    volumes:
      - ./coturn/turnserver.prod.conf:/etc/coturn/turnserver.base.conf:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -z "$$EXTERNAL_IP" ]; then
          echo "EXTERNAL_IP is required for coturn" >&2
          exit 1
        fi
        sed "s|^# external-ip=.*|external-ip=$$EXTERNAL_IP|" /etc/coturn/turnserver.base.conf \
          | sed "s|^user=.*|user=$${TURN_USERNAME}:$${TURN_PASSWORD}|" \
          > /tmp/turnserver.conf
        echo "external-ip=$$EXTERNAL_IP" >> /tmp/turnserver.conf
        exec turnserver -c /tmp/turnserver.conf

networks:
  hc:

volumes:
  pgdata_prod:
